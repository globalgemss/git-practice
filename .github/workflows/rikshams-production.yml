name: RikshaMS React Production Check

on:
  push:
    branches:
      - rikshams-production-upgrade
      - rikshams-v21-full
    paths:
      - 'rikshams-v21-react/**'
      - '.github/workflows/rikshams-production.yml'
  pull_request:
    paths:
      - 'rikshams-v21-react/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rikshams-v21-react
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rikshams-v21-react/package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
